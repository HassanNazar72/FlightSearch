# Render Blueprint: creates the Django API as a free web service.
# The React app is deployed separately on Vercel (see README).
services:
  - type: web
    name: skycompare-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One worker so the in-memory cache is shared by all requests; threads handle concurrency.
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 8 --timeout 30
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://skycompare.vercel.app
